name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build iPhone and iPad app
        run: >-
          xcodebuild
          -project CommonGroundApp.xcodeproj
          -scheme CommonGround
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/CommonGroundDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Test CommonGroundKit
        run: swift test --parallel

  ui-tests:
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        device:
          - iPhone 16 Pro
          - iPad Pro 13-inch (M4)
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Run native flow and accessibility tests
        run: >-
          xcodebuild
          -project CommonGroundApp.xcodeproj
          -scheme CommonGround
          -destination 'platform=iOS Simulator,name=${{ matrix.device }},OS=latest'
          -derivedDataPath "$RUNNER_TEMP/CommonGroundUITests"
          test
